name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: Lint, tipos, testes e build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        run: npm run build

      - name: Popular o banco de demonstração
        run: |
          npm run seed
          npm run seed

      - name: Conferir health check da API e a interface
        run: |
          npm run start --workspace server &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3333/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:3333/api/health
          curl --fail --silent http://localhost:3333/api/dashboard > /dev/null
          curl --fail --silent http://localhost:3333/ > /dev/null
